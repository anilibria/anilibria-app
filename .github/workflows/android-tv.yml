name: Build Android TV APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build TV debug APK
        run: ./gradlew :app-tv:assembleAppDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-tv-debug-apk
          path: app-tv/build/outputs/apk/app/debug/*.apk
          if-no-files-found: error
