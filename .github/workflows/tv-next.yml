name: Проверка нового TV-клиента
on:
  push:
    branches: [integration/tv-next-upstream]
  pull_request:
    branches: [develop]
    paths: ['tv-next/**', '.github/workflows/tv-next.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tv-next-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-next
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: AniLiberty-TV-Next-debug
          path: tv-next/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AniLiberty-TV-Next-release-checks
          path: |
            tv-next/app/build/outputs/apk/release/*.apk
            tv-next/app/build/reports/
          if-no-files-found: warn
